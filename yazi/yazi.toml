[mgr]

ratio = [1, 3, 4]
sort_by = "natural"
sort_sensitive = true
sort_dir_first = true
linemode = "size" # TODO: Fazer função "size_and_owner" para dizer tamanho e dono do arquivo.
show_hidden = false
show_symlink = true
scrolloff = 200

[preview]

wrap = "yes"
tab_size = 2

[opener]

play = [
	{ run = "mpv %s", 
		orphan = true 
	}
]

edit = [
	{ run = "$EDITOR %s", 
		block = true 
	}
]

open = [
	{ run = "xdg-open %s", 
		orphan = true, 
		desc = "Open" 
	}
]

krita = [
	{ run = "krita %s", 
		orphan = true, 
		desc = "Open" 
	}
]

blender = [
	{ run = "blender %s", 
		orphan = true, 
		desc = "Open" 
	}
]

view = [
	{ run = "mpv %s",
		orphan = true
	}
]

[open]
rules = [

	{ mime = "image/*",
		use = "view"
	},

	{ mime = "video/*", 
		use = "play" 
	},

	{ mime = "audio/*",
		use = "play"
	},

	{ mime = "text/*", 
		use = "edit" 
	},

	{ url = "*.aup3", 
		use = "open"
	},

	{ url = "*.kra", 
		use = "krita" 
	},

	{ url = "*.blend",
		use = "blender" }

	# TODO: Fazer regras para arquivos de documentos.
	# pdf, etc --> "open"
	# docx, etc --> "edit"
]
