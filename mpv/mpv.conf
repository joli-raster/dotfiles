keep-open=yes
autofit-larger=60%x60%

[music]
profile-cond=path:find('mp3')
profile-cond=path:find('flac')
profile-cond=path:find('wav')
profile-cond=path:find('opus')
profile-cond=path:find('ogg')
profile-desc="Redimensiona o MPV para músicas com capas nos meta-dados"
autofit-larger=20%x20%

[pic]
profile-cond=path:find('png')
profile-cond=path:find('jpg')
profile-cond=path:find('jpeg')
profile-cond=path:find('tif')
profile-cond=path:find('tiff')
profile-cond=path:find('gif')
profile-cond=path:find('webm')
profile-cond=path:find('bmp')
profile-cond=path:find('svg')
autofit-larger=40%x40%
